<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiLegends</title>
    <link rel="stylesheet" href="./output.css" />
    <link
      rel="shortcut icon"
      href="./img/Logo_WikiLegends.png"
      type="image/png"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins"
      rel="stylesheet"
    />
  </head>

  <body
    class="font-poppins bg-gradient-to-br from-background via-dark to-secondary bg-no-repeat bg-cover overflow-x-hidden min-h-screen flex flex-col gap-10"
  >
    <header class="wl-header">
      <nav class="wl-container flex items-center justify-between py-4">
        <a class="wl-brand" href="./index.html">
          <span class="wl-title-badge">Wiki</span>
          <span class="text-lg sm:text-xl">Legends</span>
        </a>

        <div class="hidden sm:flex items-center gap-2">
          <a class="wl-navlink" href="./champions/champions.html">Champions</a>
          <a class="wl-navlink" href="#">Items</a>
          <a class="wl-navlink" href="#">Runes</a>
        </div>
      </nav>
    </header>

    <main class="wl-container py-12 sm:py-16 flex-1">
      <section class="text-center space-y-6">
        <h1 class="wl-title">
          <span class="wl-title-badge">Wiki</span>Legends
        </h1>
        <div
          class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-3"
        >
          <a href="./champions/champions.html" class="wl-btn-primary"
            >Browse Champions</a
          >
        </div>
      </section>

      <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
        <div class="wl-card wl-card-hover p-8 flex flex-col gap-6">
          <h3 class="wl-card-title">Champions</h3>
          <p class="wl-card-text">
            Search, sort, and filter by role and damage type.
          </p>
          <div class="pt-2">
            <a href="./champions/champions.html" class="wl-btn-primary w-full"
              >Open</a
            >
          </div>
        </div>

        <div class="wl-card wl-card-hover p-8 flex flex-col gap-6">
          <h3 class="wl-card-title">Runes</h3>
          <p class="wl-card-text">Browse rune trees with quick visual cards.</p>
          <div class="pt-2">
            <a href="#" class="wl-btn-ghost w-full">In Developpement</a>
          </div>
        </div>

        <div class="wl-card wl-card-hover p-8 flex flex-col gap-6">
          <h3 class="wl-card-title">Items</h3>
          <p class="wl-card-text">
            Item database (page ready, content in progress).
          </p>
          <div class="pt-2">
            <a href="#" class="wl-btn-ghost w-full">In Developpement</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="wl-container text-grey text-center py-10">
      <h2></h2>
    </footer>

    <script type="module" src="./js/dynamicDate.js"></script>
  </body>
</html>
